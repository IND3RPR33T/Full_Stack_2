name: Backend CI

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'Websocketdev/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - 'Websocketdev/**'

jobs:
  build-and-test:
    name: Build & Test Spring Boot
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout code ──────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Java 21 ────────────────────────────────────────────
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # ── 3. Make mvnw executable (Linux) ──────────────────────────────
      - name: Grant execute permission for mvnw
        run: chmod +x ./Websocketdev/mvnw
        working-directory: .

      # ── 4. Build with Maven ───────────────────────────────────────────
      - name: Build with Maven
        run: ./mvnw clean package -DskipTests
        working-directory: Websocketdev

      # ── 5. Run Tests ──────────────────────────────────────────────────
      - name: Run Tests
        run: ./mvnw test
        working-directory: Websocketdev

      # ── 6. Upload JAR artifact ────────────────────────────────────────
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: websocketdev-jar
          path: Websocketdev/target/*.jar
          retention-days: 7
