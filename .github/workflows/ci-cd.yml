name: Full Stack CI/CD

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # ════════════════════════════════════════
  # JOB 1 — Backend CI (Spring Boot)
  # ════════════════════════════════════════
  backend:
    name: "Backend — Build & Test"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Grant mvnw permissions
        run: chmod +x ./Websocketdev/mvnw

      - name: Build with Maven (skip tests)
        run: ./mvnw clean package -DskipTests
        working-directory: Websocketdev

      - name: Run unit tests
        run: ./mvnw test
        working-directory: Websocketdev

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: websocketdev-backend-${{ github.sha }}
          path: Websocketdev/target/*.jar
          retention-days: 14

  # ════════════════════════════════════════
  # JOB 2 — Frontend CI (React + Vite)
  # ════════════════════════════════════════
  frontend:
    name: "Frontend — Build"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build production bundle
        run: npm run build
        working-directory: frontend

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: nexuschat-frontend-${{ github.sha }}
          path: frontend/dist/
          retention-days: 14

  # ════════════════════════════════════════
  # JOB 3 — CD Summary (after both pass)
  # ════════════════════════════════════════
  summary:
    name: "CI/CD Summary"
    runs-on: ubuntu-latest
    needs: [ backend, frontend ]
    if: always()

    steps:
      - name: Check results
        run: |
          echo "=============================="
          echo "  NexusChat CI/CD Summary"
          echo "=============================="
          echo "Backend job : ${{ needs.backend.result }}"
          echo "Frontend job: ${{ needs.frontend.result }}"
          echo ""
          if [ "${{ needs.backend.result }}" == "success" ] && [ "${{ needs.frontend.result }}" == "success" ]; then
            echo "✅ All checks passed — ready to deploy!"
          else
            echo "❌ One or more checks failed."
            exit 1
          fi
