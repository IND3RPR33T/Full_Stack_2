spring.application.name=Websocketdev

# Increase WebSocket message buffer sizes to support base64 voice message payloads (~1MB)
spring.websocket.max-text-message-size=5242880
spring.websocket.max-binary-message-size=5242880

# Increase Tomcat HTTP POST sizes (for SockJS fallbacks)
server.tomcat.max-http-form-post-size=5MB
server.tomcat.max-swallow-size=5MB
